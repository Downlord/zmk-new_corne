name: Generate Release

on:
  workflow_dispatch:
  # push:
  #   paths-ignore:
  #     - "keymap-drawer/**"

permissions:
  contents: write
  discussions: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          patchAll: true
          noNewCommitBehavior: silent
          noVersionBumpBehavior: silent
          fallbackTag: v0.0.1
      
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          # Optional, GitHub token, a Personal Access Token with `public_repo` scope if needed
          # Required, if the artifact is from a different repo
          # Required, if the repo is private a Personal Access Token with `repo` scope is needed or GitHub token in a job where the permissions `action` scope set to `read`
          github_token: ${{secrets.GITHUB_TOKEN}}
          # Optional, workflow file name or ID
          # If not specified, will be inferred from run_id (if run_id is specified), or will be the current workflow
          workflow: build.yml
          # If no workflow is set and workflow_search set to true, then the most recent workflow matching
          # all other criteria will be looked up instead of using the current workflow
          workflow_search: false
          # Optional, the status or conclusion of a completed workflow to search for
          # Can be one of a workflow conclusion:
          #   "failure", "success", "neutral", "cancelled", "skipped", "timed_out", "action_required"
          # Or a workflow status:
          #   "completed", "in_progress", "queued"
          # Use the empty string ("") to ignore status or conclusion in the search
          workflow_conclusion: success
          # Optional, will get head commit SHA
          # pr: ${{github.event.pull_request.number}}
          # Optional, no need to specify if PR is
          # commit: ${{github.event.pull_request.head.sha}}
          # Optional, will use the specified branch. Defaults to all branches
          # branch: master
          # Optional, defaults to all types
          # event: push
          
          repo: ${{ github.repository }}
          # Optional, check the workflow run to whether it has an artifact
          # then will get the last available artifact from the previous workflow
          # default false, just try to download from the last one
          check_artifacts: false
          # Optional, search for the last workflow run whose stored an artifact named as in `name` input
          # default false
          search_artifacts: false
          # Optional, choose to skip unpacking the downloaded artifact(s)
          # default false
          skip_unpack: false
          # Optional, choose how to exit the action if no artifact is found
          # can be one of:
          #  "fail", "warn", "ignore"
          # default fail
          if_no_artifact_found: fail
          # Optional, include forks when searching for artifacts
          # default false
          allow_forks: true
          # Optional, choose to unpack the downloaded artifact(s) using `unzip` system utility
          # default false
          use_unzip: false
          
      - name: Copy left result out of nix store
        run: cp eyelash_corne_studio_left.uf2 corne_left_${{ steps.semver.outputs.next }}.uf2

      - name: Copy right result out of nix store
        run: cp nice_view-eyelash_corne_right-zmk.uf2 corne_right_${{ steps.semver.outputs.next }}.uf2

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: corne_left_${{ steps.semver.outputs.next }}.uf2
          path: corne_left_${{ steps.semver.outputs.next }}.uf2

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: corne_right_${{ steps.semver.outputs.next }}.uf2
          path: corne_right_${{ steps.semver.outputs.next }}.uf2

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.semver.outputs.next }}
          tag_name: ${{ steps.semver.outputs.next }}
          generate_release_notes: true
          make_latest: true
          files: |
            corne_left_${{ steps.semver.outputs.next }}.uf2
            corne_right_${{ steps.semver.outputs.next }}.uf2